<!DOCTYPE html>
<html>

<head>

<title>Feedback Form</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="navbar">

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="feedback.html">Feedback</a>

</div>

<h2>Feedback Form</h2>

<div class="box">

<form>

<label>Full Name</label>
<br>

<input type="text" placeholder="Enter your full name" required minlength="3">

<br><br>

<label>Email Address</label>
<br>

<input type="email" placeholder="example@gmail.com" required>

<br><br>

<h3 class="sticky">Rate Our Website</h3>

<input type="radio" name="rating">
<label>Very Satisfied</label>

<br>

<input type="radio" name="rating">
<label>Satisfied</label>

<br>

<input type="radio" name="rating">
<label>Neutral</label>

<br>

<input type="radio" name="rating">
<label>Unsatisfied</label>

<br><br>

<h3>Your Interests</h3>

<input type="checkbox">
<label>Web Development</label>

<br>

<input type="checkbox">
<label>Mobile Development</label>

<br>

<input type="checkbox">
<label>AI & Machine Learning</label>

<br><br>

<label>Select Country</label>

<br>

<select required>

<option>Nepal</option>
<option>India</option>
<option>USA</option>

</select>

<br><br>

<label>Write your feedback here</label>

<br>

<textarea rows="5" cols="30" maxlength="200" placeholder="Write your feedback here" required></textarea>

<br><br>

<button type="submit">Submit</button>

</form>

</div>

</body>

</html>
